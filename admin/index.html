<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>Admin Login | Global Vision Aid</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="admin.css"
    >
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="brand">

                <div class="brand-icon">
                    <i class="fa-solid fa-hand-holding-heart"></i>
                </div>

                <div>
                    <h1>Global Vision Aid</h1>
                    <span>Administration</span>
                </div>

            </div>


            <div class="login-heading">

                <span class="eyebrow">
                    SECURE ACCESS
                </span>

                <h2>Welcome back</h2>

                <p>
                    Sign in to manage causes, campaigns,
                    stories and platform content.
                </p>

            </div>


            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <div class="input-wrap">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your admin email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrap">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <div
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span id="loginButtonText">
                        Sign in
                    </span>

                    <i
                        id="loginSpinner"
                        class="fa-solid fa-circle-notch fa-spin"
                        hidden
                    ></i>

                </button>

            </form>


            <div class="security-note">

                <i class="fa-solid fa-shield-halved"></i>

                <span>
                    Secure administrator access
                </span>

            </div>


            <a
                href="../index.html"
                class="back-home"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Back to website
            </a>

        </section>

    </main>


    <script src="admin.js"></script>

</body>
</html>
